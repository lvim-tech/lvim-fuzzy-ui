[package]
name = "lvim-fuzzy-ui"
version = "0.1.0"
edition = "2024"
license = "BSD-3-Clause"
description = "The lvim look for terminal programs: themes, canvas, icons, file and Neovim previews, the warm Neovim pool"
repository = "https://github.com/lvim-tech/lvim-fuzzy-ui"
rust-version = "1.88"

[dependencies]
crossterm = { version = "0.29", features = ["use-dev-tty"] }
rmpv = "1.3"
toml = "0.9"
libc = "0.2"
# SIGWINCH into a pipe, so the input thread wakes for a resize without polling (crossterm already depends on it)
signal-hook = "0.3"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "parsing", "regex-fancy"] }
unicode-width = "0.2"
# Material file icons as images (kitty unicode placeholders): SVG → RGBA, and the icon theme's manifest
resvg = { version = "0.45", default-features = false }
serde_json = "1"
# previews of images (and of the frames / pages / samples the media programs make)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico", "pnm", "tga", "qoi"] }
# the Material set, embedded (assets/material.tar.gz) and installed into the shared place
flate2 = "1"
tar = "0.4"
